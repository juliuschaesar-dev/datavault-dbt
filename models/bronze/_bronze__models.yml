version: 2

models:
  - name: bronze_superstore
    description: >
      Typed, trimmed mirror of raw_superstore. No filtering, no reshaping --
      the only job of this layer is to turn text into types once, so that every
      vault structure downstream hashes the same values.
    columns:
      - name: row_id
        description: Source order-line identifier. Grain of this model.
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [not_null]
      - name: order_date
        description: Parsed from the source's MM/DD/YYYY strings.
        data_tests: [not_null]
      - name: customer_id
        description: Business key of hub_customer.
        data_tests: [not_null]
      - name: product_id
        description: Business key of hub_product.
        data_tests: [not_null]
      - name: country_code
        description: Business key of hub_country.
        data_tests: [not_null]
      - name: state_code
        description: Business key of hub_state.
        data_tests: [not_null]
      - name: sales
        data_tests: [not_null]
      - name: quantity
        data_tests: [not_null]
      - name: record_source
        description: Lineage tag naming the object this row was read from.
        data_tests: [not_null]

  - name: bronze_period
    description: >
      Typed calendar. Feeds dim_period directly -- a date has no business key
      that can change, so it never enters the vault.
    columns:
      - name: date_actual
        data_tests: [unique, not_null]
      - name: record_source
        data_tests: [not_null]
