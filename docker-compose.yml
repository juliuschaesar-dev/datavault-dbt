# Credentials are read from .env. Copy .env.example to .env before the first
# run.

services:
  postgres:
    image: postgres:16-alpine
    container_name: dv_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - dv_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dbt:
    build: .
    container_name: dv_dbt
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DBT_HOST: postgres
      DBT_PORT: 5432
      DBT_USER: ${DBT_USER}
      DBT_PASSWORD: ${DBT_PASSWORD}
      DBT_DBNAME: ${DBT_DBNAME}
      DBT_SCHEMA: ${DBT_SCHEMA}
      DBT_THREADS: ${DBT_THREADS}
    volumes:
      - .:/usr/app
    working_dir: /usr/app
    ports:
      # dbt docs serve
      - "8080:8080"

volumes:
  dv_postgres_data:
